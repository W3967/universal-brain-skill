name: ownership-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check commit tags and file ownership
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True, check=True).stdout

          TAG_RE = re.compile(r"^\[([a-z0-9][a-z0-9-]*)\]")
          errors = []

          def file_at(sha, path):
              try:
                  return sh("git", "show", f"{sha}:{path}")
              except subprocess.CalledProcessError:
                  return None

          def frontmatter_owner(text):
              if text is None or not text.startswith("---"):
                  return None
              parts = text.split("---", 2)
              if len(parts) < 3:
                  return None
              m = re.search(r"^owner:\s*(\S+)\s*$", parts[1], re.M)
              return m.group(1) if m else None

          def changed_files(sha):
              out = sh("git", "diff-tree", "--no-commit-id", "--name-only", "-r", "-m", sha)
              return sorted(set(out.split()))

          def check_index_consistency(sha):
              raw = file_at(sha, "index.json")
              if raw is None:
                  return
              try:
                  idx = json.loads(raw)
              except json.JSONDecodeError as e:
                  errors.append(f"{sha[:8]}: index.json 解析失败：{e}")
                  return
              for e in idx.get("files", []):
                  path = e.get("path", "")
                  owner = frontmatter_owner(file_at(sha, path))
                  if owner is None:
                      errors.append(f"{sha[:8]}: {path} 缺少 owner 声明")
                  elif e.get("owner") != owner:
                      errors.append(f"{sha[:8]}: index.json 中 {path} 的 owner 是 {e.get('owner')}，与文件头 {owner} 不一致")

          def commits_in_range(before, after):
              if before and set(before) != {"0"}:
                  try:
                      out = sh("git", "log", "--format=%H", f"{before}..{after}")
                      commits = [c for c in out.splitlines() if c.strip()]
                      if commits:
                          return commits
                  except subprocess.CalledProcessError:
                      pass
              return [after]

          before = os.environ.get("BEFORE", "")
          after = os.environ.get("AFTER", "")
          commits = commits_in_range(before, after)

          for sha in commits:
              msg = sh("git", "log", "-1", "--format=%B", sha).strip()
              first = msg.splitlines()[0] if msg.splitlines() else ""
              m = TAG_RE.match(first)
              if not m:
                  errors.append(f"{sha[:8]}: 提交信息缺少 [owner] 标记：{first!r}")
                  continue
              tag = m.group(1)
              for path in changed_files(sha):
                  if path.startswith(".github/") or not path.endswith(".md"):
                      continue
                  owner = frontmatter_owner(file_at(sha, path))
                  if owner is None:
                      errors.append(f"{sha[:8]}: {path} 缺少 owner 声明")
                  elif owner != tag:
                      errors.append(f"{sha[:8]}: {path} 的 owner 是 {owner}，但提交标记是 [{tag}]")
              if "index.json" in changed_files(sha):
                  check_index_consistency(sha)

          # Backstop: every tracked .md file must declare an owner; index must match.
          tracked = sh("git", "ls-files", "*.md").split()
          for path in tracked:
              if path.startswith(".github/"):
                  continue
              text = open(path, encoding="utf-8").read()
              if frontmatter_owner(text) is None:
                  errors.append(f"HEAD: {path} 缺少 owner 声明")
          check_index_consistency("HEAD")

          if errors:
              print("FAIL: 归属检查未通过")
              for e in sorted(set(errors)):
                  print(" -", e)
              sys.exit(1)
          print(f"PASS: 检查通过（{len(commits)} 个提交，标记与归属一致）")
          PYEOF
